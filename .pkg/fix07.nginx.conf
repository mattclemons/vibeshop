server {
    listen 8081 default_server;
    server_name attacker.test _;

    root /www/site;
    index index.html;

    location / {
        # SRI needs the cross-origin read to be permitted
        add_header Access-Control-Allow-Origin *;
        # $uri/ so the index directive actually resolves "/" to index.html
        try_files $uri $uri/ =404;
    }
}

# the phishing copy: where an open redirect lands, and what a victim sees after the click
server {
    listen 8081;
    server_name evil.test;

    root /www/evil;
    index index.html;

    location / {
        # anything, /phish included, renders the fake sign-in
        try_files $uri /index.html;
    }
}

# dangling hostname. nothing real serves it, so whoever answers for it on this IP wins.
server {
    listen 8081;
    server_name legacy.vibeshop.test;

    root /www/legacy;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
