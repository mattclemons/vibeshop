# TYPE  DATABASE  USER  ADDRESS  METHOD
local   all       all            trust

host    all       all  127.0.0.1/32          scram-sha-256
host    all       all  ::1/128               scram-sha-256

# the LAN line the module is about
host    all       all  10.0.0.0/8          scram-sha-256

# docker bridge networks: a "second LAN host" container arrives from here.
# 192.168 too: docker's default pool runs 172.17 through 172.31 and then spills into 192.168, so a
# project that has churned a few networks can land the app itself outside 172.16/12.
host    all       all  172.16.0.0/12         scram-sha-256
host    all       all  192.168.0.0/16        scram-sha-256
