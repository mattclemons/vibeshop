<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in - VibeShop</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #111; }
  main { max-width: 380px; margin: 40px auto; padding: 16px; }
  h1 { font-size: 30px; margin: 0 0 2px; }
  .sub { color: #666; font-size: 13px; margin: 0 0 18px; }
  input, button { font: inherit; padding: 6px 8px; width: 100%; box-sizing: border-box; }
  p { margin: 0 0 10px; }
  button { margin-top: 4px; }
  .note { font-size: 12px; color: #8a8f98; margin-top: 22px; line-height: 1.5; }
  code { color: #b3541e; }
</style>
</head>
<body>
<main>
  <h1>VibeShop</h1>
  <p class="sub">sign in to continue to your basket</p>
  <form onsubmit="return false">
    <p><input value="maya@vibeshop.test" placeholder="email"></p>
    <p><input type="password" value="sunshine" placeholder="password"></p>
    <button>sign in</button>
  </form>
  <p class="note">
    delivered for Host <code>evil.test</code> by the attacker's nginx, not by the shop.
    it copies the shop wholesale so that arriving here from
    <code>vibeshop.test/out?to=...</code> looks like a normal sign-in.
  </p>
</main>
</body>
</html>
